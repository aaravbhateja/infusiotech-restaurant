<div style="background-color:#FFF8F3;padding:40px 20px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <div style="max-width:420px;margin:0 auto;background:#FFFFFF;border-radius:20px;padding:40px 32px;border:1px solid #F1E7E0">
    <p style="margin:0 0 24px;font-size:22px;font-weight:800;color:#1B1716;letter-spacing:-0.02em">BlinkRest</p>
    <h1 style="margin:0 0 12px;font-size:20px;font-weight:800;color:#1B1716">Confirm your email</h1>
    <p style="margin:0 0 28px;font-size:15px;line-height:1.5;color:#4A4240">Enter this code in the app to finish signing up. It expires shortly and can only be used once.</p>
    <div style="background:#FFF1EC;border-radius:14px;padding:20px;text-align:center;margin:0 0 28px">
      <span style="font-size:36px;font-weight:800;letter-spacing:8px;color:#D9381A">{{ .Token }}</span>
    </div>
    <p style="margin:0 0 20px;font-size:13px;line-height:1.5;color:#6E6461">Or tap the button below on this device.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#D9381A;color:#FFFFFF;text-decoration:none;font-weight:800;font-size:15px;padding:14px 28px;border-radius:999px">Confirm email</a>
    <p style="margin:28px 0 0;font-size:12px;color:#8F8582">Didn&#39;t request this? You can safely ignore this email.</p>
  </div>
</div>
